name: Publicar TC real de pneumotórax
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests nibabel numpy
      - name: Baixar e compactar UM exame de pneumotórax
        run: python scripts/preparar_pneumotorax.py
      - name: Publicar TC selecionada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-torax/dados/pneumotorax.nii.gz atlas-torax/dados/pneumotorax_fonte.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publicar uma TC real de pneumotórax'
            git push
          fi
