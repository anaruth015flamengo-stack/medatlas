name: Preparar TC de Torax para MedAtlas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar conversor de exames
        run: python -m pip install --disable-pip-version-check SimpleITK
      - name: Baixar TC toracica publica (3D Slicer)
        run: |
          mkdir -p /tmp/medatlas-torax
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 25 --max-time 600 \
            'https://github.com/Slicer/SlicerLungCTAnalyzer/releases/download/SampleData/LungCTAnalyzerChestCT.nrrd' \
            --output /tmp/medatlas-torax/torax.nrrd
          echo '9bb74f4383bce0ced80243916e785ce564cc2c8f535e8273da8a04f80dff4287  /tmp/medatlas-torax/torax.nrrd' | sha256sum -c -
      - name: Converter para NIfTI compacto
        run: python scripts/preparar_torax.py
      - name: Publicar arquivo no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-torax/tc-real/dados/torax.nii.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Adicionar TC toracica real para visualizador'
            git push
          fi
