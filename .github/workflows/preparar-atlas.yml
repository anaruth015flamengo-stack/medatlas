
name: Preparar TC e segmentacoes do MedAtlas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bibliotecas
        run: python -m pip install --disable-pip-version-check numpy nibabel
      - name: Baixar TC e mascaras originais
        run: |
          git lfs install
          git clone --no-checkout --depth 1 --filter=blob:none https://github.com/isaac-for-healthcare/i4h-digital-twin.git /tmp/i4h-data
          cd /tmp/i4h-data
          git sparse-checkout init --cone
          git sparse-checkout set patient-digital-twin/examples/data/s0011
          git checkout
          git lfs pull --include='patient-digital-twin/examples/data/s0011/**'
      - name: Validar e gerar versao leve, alinhada
        run: python scripts/preparar_exame.py
      - name: Salvar dados no repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atlas-radiologia/dados
          git diff --staged --quiet || git commit -m 'Adicionar tomografia e mascaras reais validadas'
          git push
  
